services:
  - type: web
    name: streamcheck
    runtime: docker
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /healthz
    envVars:
      - key: GOMEMLIMIT
        value: 192MiB
      - key: MAX_CONCURRENT
        value: "2"
      - key: MAX_UPLOAD_BYTES
        value: "10737418240"
      - key: MAX_RECORD_BYTES
        value: "1048576"
      - key: REQUEST_TIMEOUT
        value: 10m
